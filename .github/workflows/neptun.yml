name: neptun
on:
  schedule:
    - cron: "17 0 * * 0"            # Sun 00:17 UTC: lock update + build
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      update-lock:
        description: "Update flake.lock (nixpkgs, nixos-raspberrypi) before building"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: neptun
  cancel-in-progress: false
jobs:
  build:
    # The job builds and pins main whatever the ref: a dispatch on another
    # branch would only rotate the pinned revisions away from the pointed
    # system. The step-level guards below stay (A3).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      # Always build main, whatever ref triggered the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - id: cache
        run: ci/cache-name.sh >> "$GITHUB_OUTPUT"
      # Only installs cachix and adds our (public) cache as a substituter:
      # no token or signing key (ci/publish.sh gets both via env).
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          skipPush: true
      - id: build
        env:
          UPDATE_LOCK: ${{ inputs.update-lock }}
        run: |
          set -- --event "$GITHUB_EVENT_NAME"
          if [ "$UPDATE_LOCK" = true ]; then set -- "$@" --update-lock; fi
          ci/build.sh "$@" >> "$GITHUB_OUTPUT"
      # Shellcheck and the unit tests of the scripts (rpi-pull among them)
      # before anything is published: as nix checks they run in the sandbox
      # with the pinned tools (the Pi's jq), like `nix flake check` on the host.
      - name: unit tests
        run: >-
          nix build --no-link -L
          .#checks.aarch64-linux.rpi-deploy-syntax
          .#checks.aarch64-linux.rpi-pull-unit
          .#checks.aarch64-linux.rpi-ci-unit
          .#checks.aarch64-linux.rpi-deploy-unit
      - name: push closure and pin
        env:
          CACHE: ${{ steps.cache.outputs.name }}
          TOP: ${{ steps.build.outputs.top }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
        run: ci/publish.sh "$CACHE" "$TOP"
      # Only a run on main may move the pointer.
      - id: pointer
        if: github.ref == 'refs/heads/main'
        env:
          TOP: ${{ steps.build.outputs.top }}
          SEQ: ${{ github.run_number }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main >&2
          ci/pointer.sh --seq "$SEQ" --rev "$(git rev-parse HEAD)" --file deploy/neptun.json "$TOP" >> "$GITHUB_OUTPUT"
      - name: commit lock and pointer
        if: github.ref == 'refs/heads/main'
        env:
          SEQ: ${{ github.run_number }}
        run: |
          ci/commit-push.sh --message "neptun: build $SEQ ($GITHUB_EVENT_NAME)" flake.lock deploy/neptun.json
