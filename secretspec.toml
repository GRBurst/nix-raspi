# Host-side secrets of this repo, declared for SecretSpec (https://secretspec.dev).
# Each user keeps the values in their own provider (keyring, dotenv, 1Password,
# ...: `secretspec config init`); nothing here is a value. They never go into
# the Nix store (it is world-readable on the Pi and goes to a public cache),
# so they are loaded at runtime only, for one command:
#
#   secretspec run -- rpi-deploy secrets      # push to the running Pi
#   secretspec run -- rpi-deploy flash IMAGE DEVICE --wifi-env
#
# Not through devenv's `secretspec` integration into `env.*` (that is part of
# the shell derivation).
#
# One variable per SSID of `rpi.wifi.networks` (SSID -> variable name). The
# variable below only shows the pattern and stays optional (Wi-Fi is off by
# default); a host with Wi-Fi on lists its own and marks them required.
# With the dotenv provider, quote values with spaces or `$` using single
# quotes: RPI_WIFI_HOME='my pass phrase'.

[project]
name = "nix-raspi"
revision = "1.0"

[profiles.default]
RPI_WIFI_HOME = { description = "Wi-Fi PSK of the network mapped to RPI_WIFI_HOME in rpi.wifi.networks", required = false }
